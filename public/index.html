<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utica Av — A C B15 B65</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #222;
      --text: #f0f0f0;
      --muted: #666;
      --blue: #2850ad;
      --bus-green: #00933c;
      --arriving-color: #ffd700;
      --green: #4caf50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 40px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .station-name { font-size: 2rem; font-weight: 700; letter-spacing: 0.02em; }
    .station-sub { font-size: 0.95rem; color: var(--muted); margin-top: 4px; }

    .clock {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      min-width: 120px;
      text-align: right;
    }

    .route-badges { display: flex; gap: 10px; margin-top: 8px; }

    .badge {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; color: #fff;
    }
    .badge.subway { background: var(--blue); }
    .badge.bus { background: var(--bus-green); border-radius: 6px; font-size: 0.75rem; }

    /* ── Sections ── */
    main { flex: 1; padding: 28px 40px; display: flex; flex-direction: column; gap: 28px; }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }

    .panel-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .train-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .train-row:last-child { border-bottom: none; }

    .train-badge {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem; color: #fff;
      flex-shrink: 0;
    }
    .train-badge.bus { background: var(--bus-green); border-radius: 8px; font-size: 0.85rem; }

    .train-info { flex: 1; }
    .train-dest { font-size: 0.9rem; font-weight: 500; color: var(--text); }

    .train-mins {
      font-size: 1.8rem;
      font-weight: 700;
      min-width: 70px;
      text-align: right;
    }
    .train-mins .unit { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
    .train-mins.arriving { color: var(--arriving-color); }

    /* ── Bus section ── */
    .bus-section .panels { grid-template-columns: 1fr 1fr; }

    .bus-pending {
      color: var(--muted);
      font-size: 0.88rem;
      padding: 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .key-badge {
      display: inline-block;
      background: #2a2a00;
      color: #ffd700;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #554400;
    }

    .stat-cols { display: flex; gap: 20px; align-items: center; }
    .stat { text-align: center; min-width: 54px; }
    .stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
    .stat-label.primary { color: var(--text); font-weight: 700; letter-spacing: 0.14em; }
    .stat-val { font-size: 1.5rem; font-weight: 700; line-height: 1; }
    .stat-val.dim { font-size: 1.2rem; font-weight: 400; color: var(--muted); }
    .stat-val .unit { font-size: 0.75rem; font-weight: 400; color: var(--muted); }
    .stat-val.urgent { color: var(--arriving-color); }
    .stat-divider { width: 1px; height: 32px; background: var(--border); }

    .empty-state { color: var(--muted); font-size: 0.9rem; padding: 14px 0; }

    footer {
      padding: 14px 40px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--green); margin-right: 7px;
    }
    .status-dot.error { background: #f44; }

    @media (max-width: 720px) {
      main { padding: 16px 20px; }
      header { padding: 18px 20px; }
      .station-name { font-size: 1.4rem; }
      .panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="station-name">Utica Av</div>
    <div class="station-sub">Brooklyn · Crown Heights</div>
    <div class="route-badges">
      <div class="badge subway">A</div>
      <div class="badge subway">C</div>
      <div class="badge bus" id="badge-b15">B15</div>
      <div class="badge bus" id="badge-b65">B65</div>
    </div>
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <!-- Subway -->
  <div class="subway-section">
    <div class="section-title">🚇 A · C Trains — Utica Av</div>
    <div class="panel">
      <div class="panel-label">↑ Northbound · Manhattan</div>
      <div id="subway-north"><div class="empty-state">Loading...</div></div>
    </div>
  </div>

  <!-- Bus -->
  <div class="bus-section">
    <div class="section-title">🚌 B15 · B65 Buses — Bergen St / Utica Av</div>
    <div id="bus-content">
      <div class="bus-pending">
        <span class="key-badge">API KEY PENDING</span>
        Bus arrivals will appear once the MTA Bus Time API key is configured.
      </div>
    </div>
  </div>
</main>

<footer>
  <div><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting...</span></div>
  <div>Updates every 30s · MTA GTFS-RT + Bus Time</div>
</footer>

<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const m = now.getMinutes().toString().padStart(2, '0');
    const s = now.getSeconds().toString().padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s} ${ampm}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Render helpers ──
  const WALK_MINS = 10;

  function trainRow(t) {
    const badgeClass = t.type === 'bus' ? 'train-badge bus' : 'train-badge';

    if (t.type === 'subway') {
      const leaveIn = t.minsAway - WALK_MINS;
      const isUrgent = leaveIn <= 0;
      const isSoon = leaveIn >= 1 && leaveIn <= 3;
      const leaveValHtml = isUrgent
        ? `<div class="stat-val urgent">Go!</div>`
        : `<div class="stat-val${isSoon ? ' urgent' : ''}">${leaveIn}<span class="unit">m</span></div>`;
      return `
        <div class="train-row">
          <div class="${badgeClass}">${t.route}</div>
          <div class="train-info"><div class="train-dest">${t.directionLabel}</div></div>
          <div class="stat-cols">
            <div class="stat">
              <div class="stat-label primary">Leave in</div>
              ${leaveValHtml}
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
              <div class="stat-label">Train in</div>
              <div class="stat-val dim">${t.minsAway}<span class="unit">m</span></div>
            </div>
          </div>
        </div>`;
    }

    // Bus — keep original style
    const isArriving = t.minsAway <= 1;
    const minsHtml = isArriving
      ? `<div class="train-mins arriving">Now</div>`
      : `<div class="train-mins">${t.minsAway}<span class="unit">min</span></div>`;
    return `
      <div class="train-row">
        <div class="${badgeClass}">${t.route}</div>
        <div class="train-info"><div class="train-dest">${t.directionLabel}</div></div>
        ${minsHtml}
      </div>`;
  }

  function renderList(containerId, trains, limit = 5) {
    const el = document.getElementById(containerId);
    // For subway trains, filter out ones you can no longer make it to in time
    const catchable = trains.filter(t => t.type !== 'subway' || t.minsAway >= WALK_MINS - 1);
    if (!catchable.length) {
      el.innerHTML = '<div class="empty-state">No trains you can catch right now</div>';
      return;
    }
    el.innerHTML = catchable.slice(0, limit).map(trainRow).join('');
  }

  // ── Bus panels ──
  function renderBus(buses) {
    const b15 = buses.filter(b => b.route === 'B15');
    const b65 = buses.filter(b => b.route === 'B65');
    document.getElementById('bus-content').innerHTML = `
      <div class="panels">
        <div class="panel">
          <div class="panel-label">B15 · Bedford-Stuyvesant → JFK</div>
          <div id="bus-b15"></div>
        </div>
        <div class="panel">
          <div class="panel-label">B65 · Downtown Brooklyn → Crown Heights</div>
          <div id="bus-b65"></div>
        </div>
      </div>`;
    renderList('bus-b15', b15);
    renderList('bus-b65', b65);
  }

  // ── Fetch & update ──
  async function refresh() {
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    try {
      const res = await fetch('/api/arrivals');
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);

      // Subway (Manhattan-bound only)
      renderList('subway-north', data.subway.filter(a => a.direction === 'N'));

      // Bus
      const busSection = document.querySelector('.bus-section');
      const showBusBadges = !data.busHidden;
      document.getElementById('badge-b15').style.display = showBusBadges ? '' : 'none';
      document.getElementById('badge-b65').style.display = showBusBadges ? '' : 'none';
      if (data.busHidden) {
        busSection.style.display = 'none';
      } else if (data.busKeyMissing) {
        busSection.style.display = '';
        document.getElementById('bus-content').innerHTML = `
          <div class="bus-pending">
            <span class="key-badge">API KEY PENDING</span>
            Bus arrivals will appear once the MTA Bus Time API key is configured.
          </div>`;
      } else {
        busSection.style.display = '';
        renderBus(data.buses);
      }

      const d = new Date(data.fetchedAt);
      statusText.textContent = `Last updated ${d.toLocaleTimeString()}`;
      dot.className = 'status-dot';
    } catch (err) {
      dot.className = 'status-dot error';
      statusText.textContent = `Error: ${err.message}`;
    }
  }

  refresh();
  setInterval(refresh, 30_000);
</script>
</body>
</html>
