<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utica Av — A C B15 B65</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #222;
      --text: #f0f0f0;
      --muted: #666;
      --blue: #2850ad;
      --bus-green: #00933c;
      --arriving-color: #ffd700;
      --green: #4caf50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 40px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: background 1s ease;
    }

    /* Weather themes */
    header.sunny {
      background: linear-gradient(135deg, #6b4400 0%, #8c5a00 40%, #3d2800 100%);
      border-bottom-color: #b87800;
    }
    header.rainy {
      background: linear-gradient(135deg, #0a1e3d 0%, #0f2e5a 40%, #071424 100%);
      border-bottom-color: #1a4a80;
    }
    header.stormy {
      background: linear-gradient(135deg, #150e2e 0%, #1e1540 40%, #0a0a14 100%);
      border-bottom-color: #3a2a70;
    }
    header.cloudy {
      background: linear-gradient(135deg, #0d2233 0%, #1a3a52 40%, #0a1a28 100%);
      border-bottom-color: #2a5070;
    }
    header.foggy {
      background: linear-gradient(135deg, #1a1a20 0%, #25252e 40%, #10101a 100%);
      border-bottom-color: #363640;
    }
    header.snowy {
      background: linear-gradient(135deg, #0e1e30 0%, #1a2e44 40%, #0a1420 100%);
      border-bottom-color: #2a4a66;
    }

    /* Rain animation */
    .rain-container {
      position: absolute; inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .raindrop {
      position: absolute;
      top: -20px;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(100,160,255,0.7));
      border-radius: 1px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(200px); opacity: 0; }
    }

    /* Sun glow */
    .sun-glow {
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,210,60,0.7) 0%, rgba(255,160,0,0.3) 50%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* Snow animation */
    .snowflake {
      position: absolute;
      top: -10px;
      color: rgba(200,230,255,0.5);
      font-size: 10px;
      animation: snowfall linear infinite;
    }
    @keyframes snowfall {
      to { transform: translateY(160px) rotate(360deg); opacity: 0; }
    }

    /* Lightning flash */
    .lightning {
      position: absolute; inset: 0;
      background: rgba(180,160,255,0.08);
      opacity: 0;
      animation: lightning 8s ease-in-out infinite;
    }
    @keyframes lightning {
      0%, 89%, 91%, 93%, 100% { opacity: 0; }
      90%, 92% { opacity: 1; }
    }

    .weather-badge {
      display: flex; align-items: center; gap: 10px;
      margin-top: 10px;
    }
    .weather-emoji { font-size: 1.8rem; line-height: 1; }
    .weather-temp { font-size: 1.4rem; font-weight: 700; color: var(--text); letter-spacing: 0.02em; }

    .station-name { font-size: 2rem; font-weight: 700; letter-spacing: 0.02em; }
    .station-sub { font-size: 0.95rem; color: var(--muted); margin-top: 4px; }

    .clock {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      min-width: 120px;
      text-align: right;
    }

    .route-badges { display: flex; gap: 10px; margin-top: 8px; }

    .badge {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; color: #fff;
    }
    .badge.subway { background: var(--blue); }
    .badge.bus { background: var(--bus-green); border-radius: 6px; font-size: 0.75rem; }

    /* ── Sections ── */
    main { flex: 1; padding: 28px 40px; display: flex; flex-direction: column; gap: 28px; }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }

    .panel-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .train-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .train-row:last-child { border-bottom: none; }

    .train-badge {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem; color: #fff;
      flex-shrink: 0;
    }
    .train-badge.bus { background: var(--bus-green); border-radius: 8px; font-size: 0.85rem; }

    .train-info { flex: 1; }
    .train-dest { font-size: 0.9rem; font-weight: 500; color: var(--text); }

    .train-mins {
      font-size: 1.8rem;
      font-weight: 700;
      min-width: 70px;
      text-align: right;
    }
    .train-mins .unit { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
    .train-mins.arriving { color: var(--arriving-color); }

    /* ── Bus section ── */
    .bus-section .panels { grid-template-columns: 1fr 1fr; }

    .bus-pending {
      color: var(--muted);
      font-size: 0.88rem;
      padding: 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .key-badge {
      display: inline-block;
      background: #2a2a00;
      color: #ffd700;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #554400;
    }

    .stat-cols { display: flex; gap: 20px; align-items: center; }
    .stat { text-align: center; min-width: 54px; }
    .stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
    .stat-label.primary { color: var(--text); font-weight: 700; letter-spacing: 0.14em; }
    .stat-val { font-size: 1.5rem; font-weight: 700; line-height: 1; }
    .stat-val.dim { font-size: 1.2rem; font-weight: 400; color: var(--muted); }
    .stat-val .unit { font-size: 0.75rem; font-weight: 400; color: var(--muted); }
    .stat-val.urgent { color: var(--arriving-color); }
    .stat-divider { width: 1px; height: 32px; background: var(--border); }

    .empty-state { color: var(--muted); font-size: 0.9rem; padding: 14px 0; }

    footer {
      padding: 14px 40px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--green); margin-right: 7px;
    }
    .status-dot.error { background: #f44; }

    @media (max-width: 720px) {
      main { padding: 16px 20px; }
      header { padding: 18px 20px; }
      .station-name { font-size: 1.4rem; }
      .panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="station-name">Utica Av</div>
    <div class="station-sub">Brooklyn · Crown Heights</div>
    <div class="route-badges">
      <div class="badge subway">A</div>
      <div class="badge bus" id="badge-b15">B15</div>
      <div class="badge bus" id="badge-b65">B65</div>
    </div>
  </div>
  <div style="text-align: right;">
    <div class="clock" id="clock">--:--</div>
    <div class="weather-badge" id="weather-badge" style="justify-content: flex-end; margin-top: 6px;"></div>
  </div>
</header>

<main>
  <!-- Subway -->
  <div class="subway-section">
    <div class="section-title">🚇 A · C Trains — Utica Av</div>
    <div class="panel">
      <div class="panel-label">↑ Northbound · Manhattan</div>
      <div id="subway-north"><div class="empty-state">Loading...</div></div>
    </div>
  </div>

  <!-- Bus -->
  <div class="bus-section">
    <div class="section-title">🚌 B15 · B65 Buses — Bergen St / Utica Av</div>
    <div id="bus-content">
      <div class="bus-pending">
        <span class="key-badge">API KEY PENDING</span>
        Bus arrivals will appear once the MTA Bus Time API key is configured.
      </div>
    </div>
  </div>
</main>

<!-- DEV TOOLBAR — remove before ship -->
<div id="dev-toolbar" style="
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  display: none; gap: 8px; background: #1a1a1a; border: 1px solid #333;
  border-radius: 10px; padding: 8px 14px; z-index: 999; font-size: 0.8rem;
">
  <span style="color:#555; align-self:center; margin-right:4px;">DEV</span>
  <button onclick="previewWeather('sunny')">☀️ Sunny</button>
  <button onclick="previewWeather('cloudy')">☁️ Cloudy</button>
  <button onclick="previewWeather('foggy')">🌫️ Foggy</button>
  <button onclick="previewWeather('rainy')">🌧️ Rainy</button>
  <button onclick="previewWeather('stormy')">⛈️ Stormy</button>
  <button onclick="previewWeather('snowy')">❄️ Snowy</button>
</div>
<style>
  #dev-toolbar button {
    background: #2a2a2a; border: 1px solid #444; color: #ddd;
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
  }
  #dev-toolbar button:hover { background: #3a3a3a; }
</style>

<footer>
  <div><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting...</span></div>
  <div>Updates every 30s · MTA GTFS-RT + Bus Time</div>
</footer>

<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const m = now.getMinutes().toString().padStart(2, '0');
    const s = now.getSeconds().toString().padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s} ${ampm}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Weather ──
  const weatherEmoji = { sunny: '☀️', cloudy: '☁️', rainy: '🌧️', stormy: '⛈️', snowy: '❄️', foggy: '🌫️' };

  function applyWeather(weather) {
    if (!weather) return;
    const header = document.querySelector('header');
    // Remove old condition classes
    header.classList.remove('sunny', 'cloudy', 'rainy', 'stormy', 'snowy', 'foggy');
    header.classList.add(weather.condition);

    // Clear old decorations
    header.querySelectorAll('.rain-container, .sun-glow, .lightning').forEach(el => el.remove());

    if (weather.condition === 'rainy' || weather.condition === 'stormy') {
      const container = document.createElement('div');
      container.className = 'rain-container';
      const count = weather.condition === 'stormy' ? 30 : 18;
      for (let i = 0; i < count; i++) {
        const drop = document.createElement('div');
        drop.className = 'raindrop';
        drop.style.left = Math.random() * 100 + '%';
        drop.style.height = (8 + Math.random() * 14) + 'px';
        drop.style.animationDuration = (0.4 + Math.random() * 0.5) + 's';
        drop.style.animationDelay = (Math.random() * 1.5) + 's';
        container.appendChild(drop);
      }
      header.insertBefore(container, header.firstChild);
    }

    if (weather.condition === 'stormy') {
      const flash = document.createElement('div');
      flash.className = 'lightning';
      header.insertBefore(flash, header.firstChild);
    }

    if (weather.condition === 'sunny') {
      const glow = document.createElement('div');
      glow.className = 'sun-glow';
      header.insertBefore(glow, header.firstChild);
    }

    if (weather.condition === 'snowy') {
      const container = document.createElement('div');
      container.className = 'rain-container';
      for (let i = 0; i < 15; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.textContent = '❄';
        flake.style.left = Math.random() * 100 + '%';
        flake.style.fontSize = (8 + Math.random() * 8) + 'px';
        flake.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        flake.style.animationDelay = (Math.random() * 3) + 's';
        container.appendChild(flake);
      }
      header.insertBefore(container, header.firstChild);
    }

    const emoji = weatherEmoji[weather.condition] ?? '🌡️';
    document.getElementById('weather-badge').innerHTML =
      `<span class="weather-emoji">${emoji}</span><span class="weather-temp">${weather.temp}°F / ${weather.tempC}°C</span>`;
  }

  // ── Render helpers ──
  const WALK_MINS = 10;

  function trainRow(t) {
    const badgeClass = t.type === 'bus' ? 'train-badge bus' : 'train-badge';

    if (t.type === 'subway') {
      const leaveIn = t.minsAway - WALK_MINS;
      const isUrgent = leaveIn <= 0;
      const isSoon = leaveIn >= 1 && leaveIn <= 3;
      const leaveValHtml = isUrgent
        ? `<div class="stat-val urgent">Go!</div>`
        : `<div class="stat-val${isSoon ? ' urgent' : ''}">${leaveIn}<span class="unit">m</span></div>`;
      return `
        <div class="train-row">
          <div class="${badgeClass}">${t.route}</div>
          <div class="train-info"><div class="train-dest">${t.directionLabel}</div></div>
          <div class="stat-cols">
            <div class="stat">
              <div class="stat-label primary">Leave in</div>
              ${leaveValHtml}
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
              <div class="stat-label">Train in</div>
              <div class="stat-val dim">${t.minsAway}<span class="unit">m</span></div>
            </div>
          </div>
        </div>`;
    }

    // Bus — keep original style
    const isArriving = t.minsAway <= 1;
    const minsHtml = isArriving
      ? `<div class="train-mins arriving">Now</div>`
      : `<div class="train-mins">${t.minsAway}<span class="unit">min</span></div>`;
    return `
      <div class="train-row">
        <div class="${badgeClass}">${t.route}</div>
        <div class="train-info"><div class="train-dest">${t.directionLabel}</div></div>
        ${minsHtml}
      </div>`;
  }

  function renderList(containerId, trains, limit = 5) {
    const el = document.getElementById(containerId);
    // For subway trains, filter out ones you can no longer make it to in time
    const catchable = trains.filter(t => t.type !== 'subway' || t.minsAway >= WALK_MINS - 1);
    if (!catchable.length) {
      el.innerHTML = '<div class="empty-state">No trains you can catch right now</div>';
      return;
    }
    el.innerHTML = catchable.slice(0, limit).map(trainRow).join('');
  }

  // ── Bus panels ──
  function renderBus(buses) {
    const b15 = buses.filter(b => b.route === 'B15');
    const b65 = buses.filter(b => b.route === 'B65');
    document.getElementById('bus-content').innerHTML = `
      <div class="panels">
        <div class="panel">
          <div class="panel-label">B15 · Bedford-Stuyvesant → JFK</div>
          <div id="bus-b15"></div>
        </div>
        <div class="panel">
          <div class="panel-label">B65 · Downtown Brooklyn → Crown Heights</div>
          <div id="bus-b65"></div>
        </div>
      </div>`;
    renderList('bus-b15', b15);
    renderList('bus-b65', b65);
  }

  // ── Fetch & update ──
  async function refresh() {
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    try {
      const res = await fetch('/api/arrivals');
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);

      // Weather
      applyWeather(data.weather);

      // Subway (Manhattan-bound only)
      renderList('subway-north', data.subway.filter(a => a.direction === 'N'));

      // Bus
      const busSection = document.querySelector('.bus-section');
      const showBusBadges = !data.busHidden;
      document.getElementById('badge-b15').style.display = showBusBadges ? '' : 'none';
      document.getElementById('badge-b65').style.display = showBusBadges ? '' : 'none';
      if (data.busHidden) {
        busSection.style.display = 'none';
      } else if (data.busKeyMissing) {
        busSection.style.display = '';
        document.getElementById('bus-content').innerHTML = `
          <div class="bus-pending">
            <span class="key-badge">API KEY PENDING</span>
            Bus arrivals will appear once the MTA Bus Time API key is configured.
          </div>`;
      } else {
        busSection.style.display = '';
        renderBus(data.buses);
      }

      const d = new Date(data.fetchedAt);
      statusText.textContent = `Last updated ${d.toLocaleTimeString()}`;
      dot.className = 'status-dot';
    } catch (err) {
      dot.className = 'status-dot error';
      statusText.textContent = `Error: ${err.message}`;
    }
  }

  // DEV: preview weather conditions without server restart — remove before ship
  function previewWeather(condition) {
    applyWeather({ condition, temp: 72, tempC: 22 });
  }

  refresh();
  setInterval(refresh, 30_000);
</script>
</body>
</html>
