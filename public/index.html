<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utica Av — A C Trains</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #222;
      --text: #f0f0f0;
      --muted: #666;
      --a-color: #2850ad;
      --c-color: #2850ad;
      --arriving-color: #ffd700;
      --green: #4caf50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 40px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .station-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .station-sub {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .clock {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--text);
      min-width: 120px;
      text-align: right;
    }

    .route-badges {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--a-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
    }

    main {
      flex: 1;
      padding: 32px 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .direction-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .direction-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .train-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .train-row:last-child {
      border-bottom: none;
    }

    .train-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--a-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.3rem;
      color: #fff;
      flex-shrink: 0;
    }

    .train-info {
      flex: 1;
    }

    .train-dest {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    .train-mins {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      min-width: 80px;
      text-align: right;
    }

    .train-mins.arriving {
      color: var(--arriving-color);
    }

    .train-mins .unit {
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--muted);
      margin-left: 4px;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 20px 0;
    }

    footer {
      padding: 16px 40px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 8px;
    }

    .status-dot.error {
      background: #f44;
    }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; padding: 20px; }
      header { padding: 20px; }
      .station-name { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="station-name">Utica Av</div>
    <div class="station-sub">Brooklyn · Fulton St Line</div>
    <div class="route-badges">
      <div class="badge">A</div>
      <div class="badge">C</div>
    </div>
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <div class="direction-panel">
    <div class="direction-label">↑ Northbound — Manhattan</div>
    <div id="north-list"><div class="empty-state">Loading...</div></div>
  </div>
  <div class="direction-panel">
    <div class="direction-label">↓ Southbound — Far Rockaway / Lefferts</div>
    <div id="south-list"><div class="empty-state">Loading...</div></div>
  </div>
</main>

<footer>
  <div><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting...</span></div>
  <div>Updates every 30s · MTA GTFS-RT</div>
</footer>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    const s = now.getSeconds().toString().padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Render train rows
  function renderList(containerId, trains) {
    const el = document.getElementById(containerId);
    if (!trains.length) {
      el.innerHTML = '<div class="empty-state">No trains in the next hour</div>';
      return;
    }

    el.innerHTML = trains.slice(0, 5).map(t => {
      const isArriving = t.minsAway <= 1;
      const minsText = isArriving
        ? '<span class="arriving">Now</span>'
        : `${t.minsAway}<span class="unit">min</span>`;

      return `
        <div class="train-row">
          <div class="train-badge">${t.route}</div>
          <div class="train-info">
            <div class="train-dest">${t.directionLabel}</div>
          </div>
          <div class="train-mins ${isArriving ? 'arriving' : ''}">${minsText}</div>
        </div>
      `;
    }).join('');
  }

  // Fetch & update
  async function refresh() {
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    try {
      const res = await fetch('/api/arrivals');
      const data = await res.json();

      if (!data.ok) throw new Error(data.error);

      const north = data.arrivals.filter(a => a.direction === 'N');
      const south = data.arrivals.filter(a => a.direction === 'S');

      renderList('north-list', north);
      renderList('south-list', south);

      const d = new Date(data.fetchedAt);
      statusText.textContent = `Last updated ${d.toLocaleTimeString()}`;
      dot.className = 'status-dot';
    } catch (err) {
      dot.className = 'status-dot error';
      statusText.textContent = `Error: ${err.message}`;
    }
  }

  refresh();
  setInterval(refresh, 30_000);
</script>
</body>
</html>
